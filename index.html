<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>メモ置き場</title>
<style>
  body { font-family: sans-serif; background: #f4f4f2; color: #333; margin: 0; padding: 40px 20px; }
  .box { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 28px 30px; }
  h1 { font-size: 20px; margin: 0 0 12px; font-weight: normal; }
  p { font-size: 14px; line-height: 1.8; color: #555; }
  hr { border: none; border-top: 1px solid #e5e5e5; margin: 24px 0; }
  .admin { font-size: 13px; color: #777; }
  .admin input { font-size: 14px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; width: 180px; }
  .admin button { font-size: 13px; padding: 6px 14px; border: 1px solid #bbb; background: #fafafa; border-radius: 4px; cursor: pointer; }
  .msg { font-size: 13px; color: #a33; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
<div class="box">
  <h1>メモ置き場</h1>
  <p>個人的なメモを置くためのページです。<br>現在は準備中です。</p>
  <hr>
  <form class="admin" id="gateForm">
    <label for="pw">管理用パスコード</label><br>
    <input type="password" id="pw" autocomplete="off">
    <button type="submit" id="openBtn">開く</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script>
var PAYLOAD_A = {"v":2,"iter":250000,"salt":"Y3A+1odiXXnZ3kh1UAzFHw==","iv":"s08pNjnZZcvsB5Nw","parts":["memo-part-01.txt","memo-part-02.txt"]};
var PAYLOAD_B = {"v":2,"iter":250000,"salt":"LUFP22L+KNVfF1caiKGP6w==","iv":"dHT2HYjfS/fLxjeX","parts":["memo-part-03.txt","memo-part-04.txt","memo-part-05.txt","memo-part-06.txt","memo-part-07.txt","memo-part-08.txt"]};
var PAYLOAD_C = {"v":2,"iter":250000,"salt":"wabgqMui0Hc+SqAI1TlfAw==","iv":"iku1d7vi0NpbpZMH","parts":["memo-part-09.txt"]};
function b64(s) { var bin = atob(s); var out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function fetchPayload(P) {
  var chunks = [];
  for (var i = 0; i < P.parts.length; i++) {
    var r = await fetch(P.parts[i]);
    if (!r.ok) throw new Error('load failed');
    chunks.push((await r.text()).replace(/\s+/g, ''));
  }
  return { v: P.v, iter: P.iter, salt: P.salt, iv: P.iv, data: chunks.join('') };
}
async function decryptPayload(pw, P) {
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
  return new TextDecoder().decode(pt);
}
document.getElementById('gateForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  var msg = document.getElementById('msg');
  var btn = document.getElementById('openBtn');
  msg.textContent = '';
  btn.disabled = true;
  btn.textContent = '開いています…';
  (async function () {
    try {
      var fullA = await fetchPayload(PAYLOAD_A);
      var fullB = await fetchPayload(PAYLOAD_B);
      var fullC = await fetchPayload(PAYLOAD_C);
      var htmlA = await decryptPayload(pw, fullA);
      var htmlB = await decryptPayload(pw, fullB);
      var htmlC = await decryptPayload(pw, fullC);
      window.__PA = htmlA;
      window.__PB = htmlB;
      document.open();
      document.write(htmlC);
      document.close();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '開く';
      msg.textContent = 'パスコードが違います。';
    }
  })();
});
</script>
</body>
</html>
